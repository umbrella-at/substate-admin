# Alembic configuration. Run from backend/:
#
#     uv run alembic upgrade head
#     uv run alembic revision --autogenerate -m "what changed"
#
# There is no sqlalchemy.url here, deliberately. The database URL carries a password, this file
# is committed, and alembic/env.py reads the same DATABASE_URL the application does.

[alembic]
script_location = alembic

# So that `import app` resolves when alembic runs from this directory.
prepend_sys_path = .

# Revision files are named by their revision id, which is a zero-padded number rather than a
# hash: the order of the migrations is the one thing a directory listing should tell you.
file_template = %%(rev)s_%%(slug)s

# Autogenerated revisions are formatted the moment they are written, so a generated file cannot
# be what fails `ruff format --check`.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Alembic is a CLI, run by a human or by the deploy step, and its output goes to a terminal or a
# deploy log. The application's structured JSON logging does not apply here.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
