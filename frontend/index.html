    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Declared in the document rather than only in CSS, so the browser paints its own furniture
         dark — form controls, scrollbars and the flash of background before the stylesheet has
         been parsed. There is one theme and it is dark; `dark light` would invite the browser to
         choose, and it would choose wrong on the way in. -->
    <meta name="color-scheme" content="dark" />

  </head>
