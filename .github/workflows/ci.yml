# CI/CD for substate-admin: the deploy job ships and then asserts, over the public https URL, that
# the commit just pushed is the commit being served.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# uv from its own installer, not a marketplace action: every action is another repository whose
# compromise becomes ours. Exact version, not a floating major: same resolver, same resolved set.
env:
  UV_VERSION: "0.12.5"

# cancel-in-progress stays false for pushes to main: a deploy must never be cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # --severity=warning tolerates info/style: SC1091 fires on scripts reading /etc/os-release.
      # Globs rather than named files, so a script added later is linted without editing this line.
      - name: shellcheck the shell scripts
        run: shellcheck --severity=warning --shell=bash deploy/*.sh scripts/*.sh

  config:
    name: config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Caddyfile is parsed and adapted by the same Caddy version that runs in production.
      # `validate` touches no ACME: no Let's Encrypt call, and the domain need not resolve.
      - name: Validate the Caddyfile
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      # A script rather than inline YAML: a laptop runs byte for byte the command the runner runs.
      - name: Check the systemd units
        run: ./deploy/check-units.sh

  backend-quality:
    name: backend lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # UV_INSTALL_DIR and GITHUB_PATH rather than the profile line the installer would write:
      # a `run:` step is not a login shell, so whatever it appends to ~/.bashrc is never read.
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" \
            | env UV_INSTALL_DIR="$HOME/.local/bin" INSTALLER_NO_MODIFY_PATH=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `uv python install` reads backend/.python-version: under the runner's own interpreter the
      # type check covers a Python this service never runs. `--frozen` never reads pyproject.toml,
      # so `uv lock --check` is what fails on a stale lock.
      - name: Install the project
        run: |
          set -euo pipefail
          uv python install
          uv lock --check
          uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      # Its own step, so the red X says which of the two ruff checks failed.
      - name: ruff format --check
        run: uv run ruff format --check .

      # strict = true and files = ["app"] live in pyproject.toml: the same check a laptop runs.
      - name: mypy
        run: uv run mypy

  backend-tests:
    name: backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Every clock in this system is UTC: in another zone tests fail at certain hours of the day.
      TZ: UTC
      # The suite reads this and writes it into DATABASE_URL; the migration step below is handed
      # the same string, so the two cannot drift onto different databases.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/substate_admin_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: substate_admin_test
          # Production's locale (deploy/provision.sh): collation decides what `ORDER BY email`
          # means, and a runner default passes the pagination test on an ordering production lacks.
          POSTGRES_INITDB_ARGS: "--locale-provider=builtin --builtin-locale=C.UTF-8 --encoding=UTF8"
          TZ: UTC
        # Steps run on the runner, not in the service network, so the mapped port is how they reach
        # the container; the health check keeps `alembic upgrade` from racing initdb.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d substate_admin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" \
            | env UV_INSTALL_DIR="$HOME/.local/bin" INSTALLER_NO_MODIFY_PATH=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the project
        run: |
          set -euo pipefail
          uv python install
          uv lock --check
          uv sync --frozen

      # Standalone against an empty database, before pytest: a migration that only works on a
      # schema the suite already built passes the tests and fails on the server. `-x database_url=`
      # rather than exported settings: env.py takes the override first, so CI holds no app secrets.
      - name: alembic upgrade head
        run: uv run alembic -x database_url="$TEST_DATABASE_URL" upgrade head

      # conftest sets the environment from TEST_DATABASE_URL and rolls every test back; with no
      # database answering the suite refuses to run rather than skipping.
      - name: pytest
        run: uv run pytest

  frontend-quality:
    name: frontend lint, types and generated schema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # node-version-file, not a literal: a version in two places gets bumped in one, and .nvmrc is
      # what `nvm use` reads. cache-dependency-path is spelled out: the lockfile is not at the root.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, never `npm install`: ci fails when the lock and package.json disagree; install
      # rewrites the lock inside the runner and checks a dependency set that exists nowhere else.
      - name: Install the frontend
        working-directory: frontend
        run: npm ci

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: prettier --check
        working-directory: frontend
        run: npm run format:check

      - name: vue-tsc
        working-directory: frontend
        run: npm run typecheck

      # The type-drift check below needs the backend.
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" \
            | env UV_INSTALL_DIR="$HOME/.local/bin" INSTALLER_NO_MODIFY_PATH=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the backend
        working-directory: backend
        run: |
          set -euo pipefail
          uv python install
          uv sync --frozen

      # A script, not inline YAML, for the reason the units check already gives.
      - name: Check the schema and its types
        run: ./scripts/check-schema.sh


  design:
    name: design rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # The font check reads the built CSS, because "the fonts did not load" is the one rule in
      # docs/design.md that cannot fail visibly: the fallback stack renders and nothing looks wrong.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Check the design rules
        run: ./scripts/check-design.sh
  frontend-tests:
    name: frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The same clock as the rest of the system: otherwise a timestamp test depends on the runner.
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend
        working-directory: frontend
        run: npm ci

      # No --passWithNoTests: a suite that stops being found — a moved directory, an `include`
      # pattern that no longer matches — must be a red job, not a green one reporting nothing.
      - name: vitest
        working-directory: frontend
        run: npm run test

  e2e:
    name: end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
      # Its own database: the pytest suite deletes users, this one creates one and signs in as it.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/substate_admin_e2e
      # Not production: this run wants /api/docs available and wants nothing hidden. It changes no
      # route the scenario touches.
      APP_ENV: development
      # The browser reaches the site over plain http://127.0.0.1, where a Secure cookie is not
      # stored: at the default the login succeeds and the reload fails, looking like a refresh bug.
      COOKIE_SECURE: "false"
      # The account the scenario signs in as; its password is minted below, per run.
      E2E_EMAIL: e2e@substate-admin.test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: substate_admin_e2e
          # The production locale, for the same reason as the backend job.
          POSTGRES_INITDB_ARGS: "--locale-provider=builtin --builtin-locale=C.UTF-8 --encoding=UTF8"
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d substate_admin_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" \
            | env UV_INSTALL_DIR="$HOME/.local/bin" INSTALLER_NO_MODIFY_PATH=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the backend
        working-directory: backend
        run: |
          set -euo pipefail
          uv python install
          uv sync --frozen

      # Minted per run, never written down: a signing key in a public repository is a signing key,
      # and a failure trace records what Playwright types. `add-mask` hides all three from the log.
      - name: Mint the secrets this run needs
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -hex 32)"
          pepper="$(openssl rand -hex 32)"
          # tr strips the base64 characters that would need quoting in a shell or a URL; what is
          # left is still 20-odd random characters, comfortably past the 12 the policy demands.
          password="$(openssl rand -base64 24 | tr -d '/+=')"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$pepper"
          echo "::add-mask::$password"
          {
            echo "JWT_SECRET=$jwt_secret"
            echo "IP_HASH_PEPPER=$pepper"
            echo "E2E_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Build the database
        working-directory: backend
        run: |
          set -euo pipefail
          uv run --frozen alembic upgrade head
          uv run --frozen substate-admin sync-permissions

      # `create-user` reads one line when piped: a password passed as an argument shows up in /proc
      # and in the log. `admin`: with no permissions the dashboard proves only that it renders.
      - name: Create the account the scenario signs in as
        working-directory: backend
        run: |
          set -euo pipefail
          printf '%s\n' "$E2E_PASSWORD" \
            | uv run --frozen substate-admin create-user --email "$E2E_EMAIL" --role admin

      # A redirect to a file, not the step's stdout: a process holding that pipe hangs the job
      # until it times out. /api/health answers 200 only after a real SELECT 1.
      - name: Start the API
        working-directory: backend
        run: |
          set -euo pipefail
          nohup uv run --frozen uvicorn app.main:app \
            --host 127.0.0.1 --port 8000 --no-access-log \
            > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/api/health > /dev/null; then
              echo "the API answered on attempt $attempt"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the API never answered on 127.0.0.1:8000"
          cat "$RUNNER_TEMP/uvicorn.log"
          exit 1

      - name: Install the frontend
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # ONE origin for the browser, as behind Caddy: the refresh cookie's SameSite=Lax and its
      # Path=/api/auth scope mean here what they mean there. See frontend/playwright.config.ts.
      - name: Playwright
        working-directory: frontend
        run: npm run test:e2e

      # A backend exception looks, from the browser's side, like a page that did not change.
      - name: The API log
        if: failure()
        run: cat "$RUNNER_TEMP/uvicorn.log" || true

      # `trace: 'on-first-retry'` records nothing on the first attempt, so without this upload a
      # flake leaves no evidence. The report goes with it: the viewer needs to know which test.
      - name: Upload the trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: deploy
    needs: [shell, config, design, backend-quality, backend-tests, frontend-quality, frontend-tests, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Long because `uv sync` on the far side downloads and installs a dependency closure on one
    # shared vCPU the first time a release changes it.
    timeout-minutes: 15
    environment:
      name: production
      url: https://substate-admin.umbrella-at.uk
    # Deploys serialise and are never cancelled: killing a job between the upload and the symlink
    # swap is survivable, killing one between the swap and the smoke check is not.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SITE_URL: https://substate-admin.umbrella-at.uk
      DEPLOY_ROOT: /srv/substate-admin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # One short sha feeds the release directory, the RELEASE file /api/health reads back and the
      # smoke check's assertion, so none of them can drift and report a release nobody deployed.
      - name: Compute the release id
        run: echo "RELEASE=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Built here, never on the server: 2 GB shared with Postgres makes a `vite build` an OOM,
      # and the kernel kills the database rather than the build.
      - name: Build the SPA
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          # Caddy answers every unmatched path with this file: without it every route 404s and the
          # API smoke check still passes — a green deploy over a site nobody can open.
          test -f dist/index.html
          echo "built $(find dist -type f | wc -l) files for release $RELEASE"

      # StrictHostKeyChecking stays `yes`: with `=no` ssh accepts whatever key answers, so a
      # hijacked DNS record or recycled IP gets our deploy. ControlMaster: one connection, reused.
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # The host and the user appear only in this file: every step below talks to `target`,
          # so neither ever lands on a command line where it could be echoed into a log.
          cat > ~/.ssh/config <<EOF
          Host target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 120s
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config
          eval "$(ssh-agent -s)" > /dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          # printf, not echo: a secret pasted without a trailing newline is still a valid key.
          if ! printf '%s\n' "$DEPLOY_SSH_KEY" | ssh-add - > /dev/null 2>&1; then
            echo "::error::ssh-add rejected DEPLOY_SSH_KEY (malformed, or protected by a passphrase)"
            exit 1
          fi
          ssh target true
          echo "ssh: authenticated against the pinned host key"

      # --rsync-path creates the release directory on the far side: no extra ssh round trip.
      # Explicit --chmod so the mode does not depend on the runner's umask; Caddy only reads.
      - name: Upload the release
        run: |
          set -euo pipefail
          web="$DEPLOY_ROOT/releases/$RELEASE/web"
          api="$DEPLOY_ROOT/releases/$RELEASE/api"

          # --delete matters here: Vite content-hashes every filename, so an upload that only adds
          # files leaves the chunks of every previous release in the directory forever.
          rsync -az --delete --chmod=D755,F644 \
            --rsync-path="mkdir -p '$web' && rsync" \
            -e ssh \
            frontend/dist/ "target:$web/"

          # Source, not a .venv built here: that would be the right packages for the wrong machine.
          # --delete spares excluded paths, so a same-sha re-run finds its venv: `uv sync` no-ops.
          rsync -az --delete --chmod=D755,F644 \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.mypy_cache/' \
            --exclude '.ruff_cache/' \
            --exclude '.coverage' \
            --rsync-path="mkdir -p '$api' && rsync" \
            -e ssh \
            backend/ "target:$api/"

      # Everything fallible runs here, before the swap, while `current` still points at the old
      # release: a bad lockfile or a failed migration leaves the previous release serving.
      - name: Install and migrate
        run: |
          set -euo pipefail
          ssh target bash -s -- "$RELEASE" "$DEPLOY_ROOT" <<'REMOTE'
          set -euo pipefail
          release="$1"
          root="$2"
          cd "$root/releases/$release/api"

          # /api/health reads RELEASE from the working directory, the unit's WorkingDirectory, when
          # APP_COMMIT is unset. Written after the rsync, whose --delete would take it away again.
          printf '%s\n' "$release" > RELEASE

          # `set -a` exports every assignment in the unit's own env file (DATABASE_URL,
          # JWT_SECRET, IP_HASH_PEPPER); the remote shell ends here, so nothing outlives it.
          set -a
          . /etc/substate-admin/api.env
          set +a

          # --no-dev keeps pytest, mypy and ruff out of the runtime closure. --frozen installs
          # exactly what uv.lock says and never rewrites it, so the server resolves nothing.
          /usr/local/bin/uv sync --frozen --no-dev

          # --no-sync from here on: the environment was built one line ago, and the unit runs the
          # application the same way. A second sync would only be another chance to change it.
          /usr/local/bin/uv run --frozen --no-sync alembic upgrade head

          # Idempotent, and here rather than at startup: startup races itself on a restart and
          # turns a failed sync into a log line nobody reads; this fails before the symlink swap.
          /usr/local/bin/uv run --frozen --no-sync substate-admin sync-permissions
          REMOTE

      # `set -euo pipefail` INSIDE the heredoc, or ssh returns the last line's status and a failed
      # migration followed by `echo done` is a green deploy. $1 to `bash -s`: no interpolation.
      - name: Activate the release
        id: activate
        run: |
          set -euo pipefail
          ssh target bash -s -- "$RELEASE" "$DEPLOY_ROOT" <<'REMOTE'
          set -euo pipefail
          release="$1"
          root="$2"
          dir="$root/releases/$release"

          # ConditionPathExists names pyproject.toml: a release missing it is not a failed start
          # but a silent skip — restart stops the old process and starts nothing.
          test -f "$dir/web/index.html"
          test -f "$dir/api/pyproject.toml"
          test -s "$dir/api/RELEASE"

          # Remember what is live right now, so the smoke check has something to roll back to.
          prev=""
          if [ -L "$root/current" ]; then
            prev="$(readlink "$root/current")"
          fi

          # Temp link plus an atomic rename(2), not `rm current && ln -s new current`: that leaves
          # a window where the path 404s. `mv -T`, or mv moves the link into the old link's target.
          ln -sfn "$dir" "$root/.current.$$"
          mv -T "$root/.current.$$" "$root/current"

          # Re-running on the same commit yields the same short sha: recording it would point
          # `previous` at the release being deployed, and the rollback would succeed into it.
          if [ -n "$prev" ] && [ "$prev" != "$dir" ]; then
            ln -sfn "$prev" "$root/.previous.$$"
            mv -T "$root/.previous.$$" "$root/previous"
          elif [ "$prev" = "$dir" ]; then
            echo "redeploy of the same release — keeping the existing rollback target"
          fi
          echo "current -> $(readlink "$root/current")"

          # No `systemctl reload caddy`: Caddy opens /srv/substate-admin/current/web per request, so
          # the swap is live when rename(2) returns; a reload needs sudoers for a second unit.

          # Keep the last 3 releases, by mtime, and never touch the two that are reachable.
          cd "$root/releases"
          cur_name="$(basename "$(readlink -f "$root/current")")"
          prev_name=""
          if [ -L "$root/previous" ]; then
            prev_name="$(basename "$(readlink -f "$root/previous")")"
          fi
          # mapfile and a plain for loop, not `ls | while read`: a piped while runs its body in a
          # subshell, and pipefail turns a false last iteration into a failure past the swap.
          mapfile -t stale < <({ ls -1dt -- */ 2>/dev/null || true; } | tail -n +4 | sed 's#/$##')
          for old in "${stale[@]}"; do
            if [ -z "$old" ] || [ "$old" = "$cur_name" ] || [ "$old" = "$prev_name" ]; then
              continue
            fi
            echo "pruning release $old"
            rm -rf -- "${root:?}/releases/$old"
          done
          REMOTE

      # WorkingDirectory resolves per start: until this runs the old code still serves, out of a
      # directory pruning may have deleted. `sudo -n` fails on a missing rule instead of hanging;
      # `restart` returns on execve, so a started unit is not yet a process that answers.
      - name: Restart the API
        run: ssh target 'sudo -n systemctl restart substate-admin-api.service'

      # The public URL, not 127.0.0.1: proves DNS, the certificate, Caddy, the symlink, uvicorn and
      # Postgres at once. All three assertions carry: a bare 200 also comes from index.html if
      # Caddy stops stripping /api, `commit` rules out a stale release, `db` is a real SELECT 1.
      - name: Smoke check
        id: smoke
        run: |
          set -uo pipefail
          for attempt in $(seq 1 10); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' \
              --max-time 5 -H 'Cache-Control: no-cache' "$SITE_URL/api/health" || true)"
            # Silenced: an error page is not JSON, so jq's complaint adds nothing to the http code.
            # The defaults keep an absent field from reading like a present one.
            commit="$(jq -r '.commit // empty' /tmp/health.json 2>/dev/null || true)"
            db="$(jq -r '.db // false' /tmp/health.json 2>/dev/null || true)"
            if [ "${code:-000}" = 200 ] && [ "$commit" = "$RELEASE" ] && [ "$db" = true ]; then
              echo "attempt $attempt: 200, serving $RELEASE, database answered"
              exit 0
            fi
            echo "attempt $attempt: http ${code:-000}, commit '${commit:-none}', db '${db:-none}'"
            sleep 3
          done
          echo "::error::$SITE_URL/api/health did not report $RELEASE with a live database within ~30s"
          exit 1

      # Only the code symlink moves back: forward-only migrations make it safe only while they stay
      # backward-compatible. Keyed on activation, not smoke: past the swap `current` is unverified.
      - name: Roll back
        if: failure() && steps.activate.outcome == 'success'
        run: |
          set -uo pipefail
          ssh target bash -s -- "$DEPLOY_ROOT" <<'REMOTE'
          set -euo pipefail
          root="$1"
          if [ ! -L "$root/previous" ]; then
            echo "no previous release recorded — nothing to roll back to (first deploy?)"
            exit 1
          fi
          target_dir="$(readlink "$root/previous")"
          test -d "$target_dir"
          ln -sfn "$target_dir" "$root/.current.$$"
          mv -T "$root/.current.$$" "$root/current"
          echo "rolled back: current -> $(readlink "$root/current")"

          # The swap alone changes nothing for the API: uvicorn only moves when it restarts.
          sudo -n systemctl restart substate-admin-api.service
          REMOTE

          echo "--- verifying the rollback over $SITE_URL ---"
          rolled_back=0
          for attempt in $(seq 1 5); do
            code="$(curl -sS -o /tmp/rollback.json -w '%{http_code}' \
              --max-time 5 -H 'Cache-Control: no-cache' "$SITE_URL/api/health" || true)"
            commit="$(jq -r '.commit // empty' /tmp/rollback.json 2>/dev/null || true)"
            # /api/health answers 200 only once Postgres has answered too; any commit but this one
            # is the whole claim a rollback gets to make.
            if [ "${code:-000}" = 200 ] && [ -n "$commit" ] && [ "$commit" != "$RELEASE" ]; then
              echo "attempt $attempt: 200, $commit is serving again"
              rolled_back=1
              break
            fi
            echo "attempt $attempt: http ${code:-000}, commit '${commit:-none}'"
            sleep 3
          done
          [ "$rolled_back" = 1 ] || echo "::error::rollback did not restore a healthy response — the site needs a human"

          echo "--- journalctl (last 50 lines per unit) ---"
          ssh target 'for unit in substate-admin-api caddy; do
            echo "--- $unit ---"
            journalctl -u "$unit" -n 50 --no-pager 2>/dev/null \
              || sudo -n journalctl -u "$unit" -n 50 --no-pager 2>/dev/null \
              || echo "(journal not readable by the deploy user)"
          done' || true

          echo "::error::deploy of $RELEASE failed after activation and was rolled back"
          exit 1

      - name: Stop the ssh agent
        if: always()
        run: ssh-agent -k > /dev/null 2>&1 || true
